name: CI - Build & Test

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'Package.swift'

jobs:
  test-multiplatform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build TypeScript client
        working-directory: src/Cocoar.SignalARRR.Typescript
        run: npm install && npm run build

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build solution
        working-directory: src
        run: dotnet build -c Release --no-restore

      - name: Run tests
        working-directory: src
        run: dotnet test -c Release --no-build --no-restore --verbosity normal --filter "Type!=Performance"

  test-swift:
    name: Test Swift package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Swift package
        run: swift build

      - name: Run Swift tests
        run: swift test

  integration-test:
    name: Cross-platform integration tests
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build TypeScript client
        working-directory: src/Cocoar.SignalARRR.Typescript
        run: npm install && npm run build

      - name: Run integration tests (.NET + TypeScript + Swift)
        run: chmod +x scripts/run-integration-tests.sh && scripts/run-integration-tests.sh

  build-artifacts:
    name: Build alpha artifacts
    runs-on: ubuntu-latest
    needs: [test-multiplatform, test-swift, integration-test]
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v3

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build solution
        working-directory: src
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.gv.outputs.SemVer }} -p:AssemblyVersion=${{ steps.gv.outputs.AssemblySemVer }} -p:FileVersion=${{ steps.gv.outputs.AssemblySemFileVer }}

      - name: Pack NuGet packages (alpha)
        working-directory: src
        run: dotnet pack -c Release --no-restore -o ../artifacts -p:Version=${{ steps.gv.outputs.SemVer }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and pack npm alpha
        working-directory: src/Cocoar.SignalARRR.Typescript
        run: |
          npm install
          npm version ${{ steps.gv.outputs.SemVer }} --no-git-tag-version
          npm run build
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-${{ steps.gv.outputs.SemVer }}
          path: artifacts
          retention-days: 7
