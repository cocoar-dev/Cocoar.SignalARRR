name: CD - Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  # One release mechanism for stable and prerelease alike: the tag states the version, the
  # release's "pre-release" flag states what kind it is. Everything downstream reads this job's
  # outputs instead of re-deriving the version from the tag three times over.
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      npm-tag: ${{ steps.v.outputs.npm-tag }}
      docs-version: ${{ steps.v.outputs.docs-version }}

    steps:
      - name: Derive and validate version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error ::Tag must start with 'v' (e.g. v1.2.3 or v1.2.3-beta.1). Got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error ::Invalid version format. Expected X.Y.Z or X.Y.Z-suffix, got: $VERSION"
            exit 1
          fi

          # The tag and the checkbox must agree. This is the guard that makes one workflow for both
          # kinds safe: a prerelease published without the flag would take the npm dist-tag "latest"
          # and overwrite the stable docs, and neither is undoable.
          if [[ "$VERSION" == *-* && "$IS_PRERELEASE" != "true" ]]; then
            echo "::error ::$TAG carries a prerelease suffix but the release is not marked as a pre-release. Tick 'Set as a pre-release' and publish again."
            exit 1
          fi
          if [[ "$VERSION" != *-* && "$IS_PRERELEASE" == "true" ]]; then
            echo "::error ::The release is marked as a pre-release but $TAG has no prerelease suffix. Use a suffix such as v${VERSION}-beta.1, or untick the flag."
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            NPM_TAG="prerelease"
            # A prerelease publishes its docs under the full version. Truncating to major.minor
            # would overwrite the stable line's docs with a beta. Shelf keeps "latest" on the
            # highest stable version, so this shows up in the version list without becoming the
            # default (Cocoar.Shelf ManifestService: latest = highest stable, fallback prerelease).
            DOCS_VERSION="v${VERSION}"
          else
            NPM_TAG="latest"
            DOCS_VERSION="v$(echo "$VERSION" | cut -d. -f1).$(echo "$VERSION" | cut -d. -f2)"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "npm-tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "docs-version=$DOCS_VERSION" >> $GITHUB_OUTPUT

          echo "### Release $TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** $IS_PRERELEASE" >> $GITHUB_STEP_SUMMARY
          echo "**npm dist-tag:** $NPM_TAG" >> $GITHUB_STEP_SUMMARY
          echo "**Docs version:** $DOCS_VERSION" >> $GITHUB_STEP_SUMMARY

  test-multiplatform:
    name: Test on ${{ matrix.os }}
    needs: [validate-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      # All three SDKs: the packages multi-target net8.0/net9.0/net10.0, and running the tests
      # for a framework needs its runtime, not just an SDK able to build for it.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build TypeScript client
        working-directory: src/Cocoar.SignalARRR.Typescript
        run: npm install && npm run build

      - name: Build and test
        working-directory: src
        run: |
          $testFilter = 'Type!=Performance'
          if ('${{ matrix.os }}' -ne 'ubuntu-latest') {
            $testFilter = '(Type!=Performance)&(FullyQualifiedName!~BackplaneIntegrationTests)'
          }
          # No --framework: dotnet test then runs every target framework of each test project,
          # so one job covers all three. Pinning net10.0 meant the gate never exercised net8.0 or
          # net9.0, although both are shipped.
          dotnet test Cocoar.SignalARRR.slnx -c Release --verbosity normal --filter $testFilter
        shell: pwsh

  test-swift:
    name: Test Swift package
    needs: [validate-release]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Build Swift package
        run: swift build

      - name: Run Swift tests
        run: swift test

  publish:
    name: Publish Packages
    if: github.event.release.target_commitish == 'develop'
    runs-on: ubuntu-latest
    needs: [validate-release, test-multiplatform, test-swift]
    permissions:
      contents: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Build and pack npm package
        working-directory: ./src/Cocoar.SignalARRR.Typescript
        run: |
          npm install
          npm version $RELEASE_VERSION --no-git-tag-version --allow-same-version
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Restore dependencies
        working-directory: ./src
        run: dotnet restore Cocoar.SignalARRR.slnx

      - name: Pack NuGet packages
        working-directory: ./src
        run: dotnet pack Cocoar.SignalARRR.slnx -c Release -o ../artifacts -p:Version=$RELEASE_VERSION

      - name: Ensure packages exist
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg)
          (( ${#files[@]} )) || { echo "::error ::No packages found"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.RELEASE_VERSION }}
          path: ${{ github.workspace }}/artifacts
          retention-days: 7

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg; do
            dotnet nuget push "$p" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      # The dist-tag is not cosmetic: a bare `npm publish` writes "latest", so a prerelease would
      # become what every `npm install @cocoar/signalarrr` resolves to. NuGet needs no equivalent —
      # it reads the prerelease suffix off the version string itself.
      - name: Publish npm package
        working-directory: ./src/Cocoar.SignalARRR.Typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.validate-release.outputs.npm-tag }}
        run: npm publish --tag "$NPM_TAG"

  publish-fullframework:
    name: Publish FullFramework Package
    if: github.event.release.target_commitish == 'develop'
    runs-on: windows-latest
    needs: [validate-release, test-multiplatform]
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test FullFramework client
        run: dotnet test src/tests/Cocoar.SignalARRR.Client.FullFramework.Tests/Cocoar.SignalARRR.Client.FullFramework.Tests.csproj -c Release --verbosity normal

      - name: Pack FullFramework NuGet
        run: dotnet pack src/Cocoar.SignalARRR.Client.FullFramework/Cocoar.SignalARRR.Client.FullFramework.csproj -c Release -o artifacts -p:Version=${{ env.RELEASE_VERSION }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          for p in artifacts/*.nupkg; do
            dotnet nuget push "$p" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

  deploy-docs:
    name: Deploy Documentation
    needs: [validate-release, publish, publish-fullframework]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build public docs
        working-directory: website
        run: npm run build

      - name: Package
        run: cd website/.vitepress/dist && zip -r $GITHUB_WORKSPACE/docs.zip .

      # Stable docs land on the major.minor line (v5.0); a prerelease lands on its full version
      # (v5.0.0-beta.1), so it never overwrites the stable line. Shelf accepts both — its default
      # version pattern allows a prerelease suffix — and keeps "latest" on the highest stable one.
      - name: Upload to Shelf
        env:
          KEY: ${{ secrets.SHELF_API_KEY }}
          URL: ${{ secrets.SHELF_BASE_URL }}
          VER: ${{ needs.validate-release.outputs.docs-version }}
        run: |
          echo "Deploying signalarrr docs $VER to $URL"
          curl -f -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/zip" \
            --data-binary @$GITHUB_WORKSPACE/docs.zip \
            "${URL}/_api/products/signalarrr/versions/${VER}"

      - name: Deployment summary
        run: |
          echo "### Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Product:** signalarrr" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate-release.outputs.docs-version }}" >> $GITHUB_STEP_SUMMARY
