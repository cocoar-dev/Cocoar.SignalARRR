name: CD - Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  test-multiplatform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build TypeScript client
        working-directory: src/Cocoar.SignalARRR.Typescript
        run: npm install && npm run build

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Build solution
        working-directory: src
        run: dotnet build -c Release --no-restore

      - name: Run tests
        working-directory: src
        run: dotnet test -c Release --no-build --no-restore --verbosity normal --filter "Type!=Performance"

  test-swift:
    name: Test Swift package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Build Swift package
        run: swift build

      - name: Run Swift tests
        run: swift test

  publish:
    name: Publish Packages
    if: github.event.release.target_commitish == 'develop'
    runs-on: ubuntu-latest
    needs: [test-multiplatform, test-swift]
    permissions:
      contents: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Extract and validate release version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            VERSION="${TAG#v}"
          else
            echo "::error ::Tag must start with 'v' (e.g., v1.2.3)"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid version format. Expected X.Y.Z, got: $VERSION"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Build and pack npm package
        working-directory: ./src/Cocoar.SignalARRR.Typescript
        run: |
          npm install
          npm version $RELEASE_VERSION --no-git-tag-version
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Restore dependencies
        working-directory: ./src
        run: dotnet restore

      - name: Build solution
        working-directory: ./src
        run: dotnet build -c Release --no-restore -p:Version=$RELEASE_VERSION -p:AssemblyVersion=$RELEASE_VERSION -p:FileVersion=$RELEASE_VERSION

      - name: Pack NuGet packages
        working-directory: ./src
        run: dotnet pack -c Release --no-restore -o ../artifacts -p:Version=$RELEASE_VERSION

      - name: Ensure packages exist
        run: |
          shopt -s nullglob
          files=(../artifacts/*.nupkg ../artifacts/*.snupkg)
          (( ${#files[@]} )) || { echo "::error ::No packages found"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.RELEASE_VERSION }}
          path: artifacts
          retention-days: 7

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for p in ../artifacts/*.nupkg ../artifacts/*.snupkg; do
            dotnet nuget push "$p" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Publish npm package
        working-directory: ./src/Cocoar.SignalARRR.Typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

  deploy-docs:
    name: Deploy Documentation
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress
        working-directory: website
        run: npx vitepress build

      - name: Extract docs version
        id: docs-version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "value=v${MAJOR}.${MINOR}" >> $GITHUB_OUTPUT

      - name: Package
        run: cd website/.vitepress/dist && zip -r $GITHUB_WORKSPACE/docs.zip .

      - name: Upload to Shelf
        env:
          KEY: ${{ secrets.SHELF_API_KEY }}
          URL: ${{ secrets.SHELF_BASE_URL }}
          VER: ${{ steps.docs-version.outputs.value }}
        run: |
          echo "Deploying signalarrr docs $VER to $URL"
          curl -f -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/zip" \
            --data-binary @$GITHUB_WORKSPACE/docs.zip \
            "${URL}/_api/products/signalarrr/versions/${VER}"

      - name: Deployment summary
        run: |
          echo "### Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Product:** signalarrr" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.docs-version.outputs.value }}" >> $GITHUB_STEP_SUMMARY
