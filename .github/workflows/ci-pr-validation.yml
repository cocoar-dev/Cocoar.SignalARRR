name: CI - Pull Request

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'Package.swift'

jobs:
  test-multiplatform:
    name: Test .NET ${{ matrix.dotnet }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ['8.0.x', '9.0.x', '10.0.x']
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build TypeScript client
        working-directory: src/Cocoar.SignalARRR.Typescript
        run: npm install && npm run build

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Determine target framework
        id: tfm
        shell: bash
        run: |
          case "${{ matrix.dotnet }}" in
            8.0.x)  echo "framework=net8.0" >> "$GITHUB_OUTPUT" ;;
            9.0.x)  echo "framework=net9.0" >> "$GITHUB_OUTPUT" ;;
            10.0.x) echo "framework=net10.0" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore Cocoar.SignalARRR.slnx

      # Built without --framework on purpose. The solution contains netstandard2.0-only projects
      # (the source generator, the .NET Framework client); passing --framework sets TargetFramework
      # as a global property, which overrides their own TFM and fails with NETSDK1005 because the
      # restore assets have no such target. The matrix exists to run the *tests* on each runtime,
      # which the next step still does via --framework.
      - name: Build solution
        working-directory: src
        run: dotnet build Cocoar.SignalARRR.slnx -c Release --no-restore -p:Version=${{ steps.gv.outputs.SemVer }} -p:AssemblyVersion=${{ steps.gv.outputs.AssemblySemVer }} -p:FileVersion=${{ steps.gv.outputs.AssemblySemFileVer }}

      - name: Run tests
        working-directory: src
        run: |
          $testFilter = 'Type!=Performance'
          if ('${{ matrix.os }}' -ne 'ubuntu-latest') {
            $testFilter = '(Type!=Performance)&(FullyQualifiedName!~BackplaneIntegrationTests)'
          }
          dotnet test Cocoar.SignalARRR.slnx -c Release --no-build --no-restore --verbosity normal --framework ${{ steps.tfm.outputs.framework }} --filter $testFilter
        shell: pwsh

      - name: Validate packaging
        if: matrix.dotnet == '10.0.x'
        working-directory: src
        run: dotnet pack Cocoar.SignalARRR.slnx -c Release --no-restore -p:Version=${{ steps.gv.outputs.SemVer }}

  test-swift:
    name: Test Swift package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Swift package
        run: swift build

      - name: Run Swift tests
        run: swift test

  integration-test:
    name: Integration tests (all frameworks)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build TypeScript client
        working-directory: src/Cocoar.SignalARRR.Typescript
        run: npm install && npm run build

      - name: Integration tests (.NET 10)
        env:
          DOTNET_TARGET_FRAMEWORK: net10.0
          DOTNET_TEST_FILTER: "(Type!=Performance)&(FullyQualifiedName!~BackplaneIntegrationTests)"
        run: chmod +x scripts/run-integration-tests.sh && scripts/run-integration-tests.sh

      - name: Integration tests (.NET 9)
        env:
          DOTNET_TARGET_FRAMEWORK: net9.0
          DOTNET_TEST_FILTER: "(Type!=Performance)&(FullyQualifiedName!~BackplaneIntegrationTests)"
        run: scripts/run-integration-tests.sh

      - name: Integration tests (.NET 8)
        env:
          DOTNET_TARGET_FRAMEWORK: net8.0
          DOTNET_TEST_FILTER: "(Type!=Performance)&(FullyQualifiedName!~BackplaneIntegrationTests)"
        run: scripts/run-integration-tests.sh

  test-fullframework:
    name: Test .NET Framework 4.8 Client
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and test FullFramework client
        run: dotnet test src/tests/Cocoar.SignalARRR.Client.FullFramework.Tests/Cocoar.SignalARRR.Client.FullFramework.Tests.csproj --verbosity normal
