name: Bug Report
description: Report a bug in Cocoar.SignalARRR
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the sections below.

  - type: dropdown
    id: client
    attributes:
      label: Client
      description: Which client are you using?
      options:
        - .NET (Cocoar.SignalARRR.Client)
        - TypeScript (@cocoar/signalarrr)
        - Swift (CocoarSignalARRR)
        - Server only (Cocoar.SignalARRR.Server)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of SignalARRR are you using?
      placeholder: "e.g. 4.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code snippet to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or stack traces if applicable.
